<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatFont - Dynamic Font Range Showcase</title>
    <style>
        /* The entire file strictly utilizes a clean sans-serif design */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 2rem;
        }

        header {
            border-bottom: 1px solid #21262d;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        h1 {
            color: #58a6ff;
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }

        .path {
            color: #8b949e;
            font-size: 0.9rem;
        }

        .font-container {
            display: grid;
            gap: 1.5rem;
        }

        .font-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 1.5rem;
        }

        .font-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f0f6fc;
            margin-bottom: 1rem;
            border-bottom: 1px solid #21262d;
            padding-bottom: 0.5rem;
        }

        .range-box {
            background-color: #0d1117;
            border: 1px solid #21262d;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 0.75rem;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .label {
            font-size: 0.8rem;
            color: #58a6ff;
            font-weight: bold;
            text-transform: uppercase;
        }

        .info {
            font-size: 0.75rem;
            color: #8b949e;
        }

        .char-grid {
            font-size: 1.4rem;
            line-height: 1.8;
            word-wrap: break-word;
            letter-spacing: 0.3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>MatFont Character Map Showcase</h1>
        <div class="path">Location: big / fonts / defalut / showcase-defalut.html</div>
    </header>

    <div class="font-container" id="showcase-target">
        <!-- Generated font cards will automatically populate here via JavaScript -->
    </div>

    <script>
        // Raw string representation of your custom font layout configuration
        const rawConfig = `stylez:{
        filenames:
        [
                "default_font.png"
        ]
}
unicode:{
        range:
                [
                        {name:"enBIG",from: "U+0041", to: "U+005A"},
                        {name:"enSMALL",from: "U+0061", to: "U+007A"},
                        {name:"num",from: "U+0030", to: "U+0039"},
                        {name:"emoji_misc", from: "U+2600", to: "U+27BF"},
                        {name:"emoji_transport", from: "U+1F300", to: "U+1F5FF"}, 
                        {name:"emoji_faces", from: "U+1F600", to: "U+1F64F"},     
                        {name:"emoji_extended", from: "U+1F900", to: "U+1F9FF"},
                        {name:"sym1",from: "U+0020", to: "U+002F"},
                        {name:"sym2",from: "U+003A", to: "U+0040"},
                        {name:"sym3",from: "U+005B", to: "U+0060"},
                        {name:"sym4",from: "U+007B", to: "U+007E"}
                ]
}`;

        // Custom parser designed specifically to process your stylez file configuration format
        function parseStylezConfig(configText) {
            const ranges = [];
            // Regex patterns tailored to read your custom property blocks
            const rangeBlockRegex = /\{name:\s*"([^"]+)"\s*,\s*from:\s*"U\+([0-9A-Fa-f]+)"\s*,\s*to:\s*"U\+([0-9A-Fa-f]+)"\}/g;
            let match;

            while ((match = rangeBlockRegex.exec(configText)) !== null) {
                ranges.push({
                    name: match[1],
                    from: parseInt(match[2], 16),
                    to: parseInt(match[3], 16),
                    fromStr: `U+${match[2].toUpperCase()}`,
                    toStr: `U+${match[3].toUpperCase()}`
                });
            }
            return ranges;
        }

        // Loops through hex ranges to resolve and generate code strings live
        function generateCharacterMap(fromCode, toCode) {
            let result = "";
            for (let i = fromCode; i <= toCode; i++) {
                result += String.fromCodePoint(i);
            }
            return result;
        }

        // Render everything dynamically into the viewport container
        function renderShowcase() {
            const container = document.getElementById("showcase-target");
            const parsedRanges = parseStylezConfig(rawConfig);

            // Create main font preview card wrapper
            const card = document.createElement("div");
            card.className = "font-card";
            card.innerHTML = `<div class="font-name">Font Configuration Map (.config)</div>`;

            // Loop and render individual block ranges dynamically inside the layout container
            parsedRanges.forEach(range => {
                const rangeBox = document.createElement("div");
                rangeBox.className = "range-box";

                const chars = generateCharacterMap(range.from, range.to);

                rangeBox.innerHTML = `
                    <div class="range-header">
                        <span class="label">${range.name}</span>
                        <span class="info">${range.fromStr} → ${range.toStr}</span>
                    </div>
                    <div class="char-grid">${chars}</div>
                `;
                card.appendChild(rangeBox);
            });

            container.appendChild(card);
        }

        // Execute rendering script on DOM initialization
        renderShowcase();
    </script>
</body>
</html>
